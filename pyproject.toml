[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-cli"
version = "0.1.0"
description = "Hybrid Textual and CLI beat upload pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.58.0",
  "rich>=13.7.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
audio = [
  "aubio>=0.4.9",
  "librosa>=0.10.2",
  "soundfile>=0.12.1",
]
llm = [
  "openai>=1.30.0",
]

tool = [
  "typer>=0.12.3",
]

dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
wizardcli = "wizardcli.cli:main"
wizard-cli = "wizardcli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that hit external services",
]
